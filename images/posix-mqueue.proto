syntax = "proto2";

import "fown.proto";

message posix_mqueue_msg_entry {
    required uint32 msg_prio = 1;
    required uint32 msg_len  = 2;
    required bytes  msg_data = 3;
}

message ipcns_pmq_data_entry {
    required uint32 id          = 1;
    required string name        = 2;

    required uint32 mq_maxmsg   = 3;
    required uint32 mq_msgsize  = 4;
    required uint32 mq_curmsgs  = 5;

    repeated posix_mqueue_msg_entry messages = 6;

    required uint32    flags = 7;
    required fown_entry fown = 8;

    /*
     * Set when the queue name was absent from the mqueue filesystem at dump
     * time (i.e. mq_unlink() was called after mq_open() but the fd was
     * still open).  On restore a temporary named queue is created, all
     * messages are replayed into it, and the name is immediately unlinked so
     * the restored fd is an anonymous (unlinked) mqueue — mirroring the
     * state at dump time.
     */
    optional bool unlinked = 9 [default = false];

    /*
     * Filesystem ownership of the mqueue file (st_uid / st_gid from
     * fstat(2)).  This is distinct from fown_entry which carries the
     * SIGIO signal-delivery owner (F_GETOWN_EX).  Saved so that
     * restore can fchown(2) the newly-created queue back to the
     * original owner — necessary when the dumped process ran as an
     * unprivileged user (e.g. in a Kubernetes user-namespace pod).
     */
    optional uint32 uid = 10;
    optional uint32 gid = 11;
}